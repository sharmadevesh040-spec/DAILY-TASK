<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#primaryGrad)" />
  
  <!-- Subtle inner card -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="#ffffff" fill-opacity="0.08" />

  <!-- Zap Lightning bolt -->
  <g filter="url(#dropShadow)">
    <polygon points="277 85 138 277 245 277 234 427 373 234 266 234" fill="#ffffff" />
  </g>

  <!-- Green Success Check Badge -->
  <g transform="translate(330, 330)">
    <circle cx="45" cy="45" r="50" fill="#10b981" stroke="#ffffff" stroke-width="10" />
    <path d="M26 46 L39 59 L64 34" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
